# Redis cache (card data, ephemeral state).
# Stateless: persistence disabled (--save "" --appendonly no), no
# PersistentVolume — matches docker-compose (redis runs with no volume).
# Service DNS `redis:6379` matches REDIS_URL in exbanka-config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: exbanka-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: exbanka-2
spec:
  selector:
    app: redis
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
