# RabbitMQ message broker (AMQP) for inter-service events.
# Stateless deployment: no PersistentVolume — queues/messages are
# ephemeral and rebuilt by services on reconnect (matches docker-compose,
# which runs rabbitmq with no volume). Default guest/guest credentials
# match RABBITMQ_URL in the exbanka-config ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: exbanka-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: mgmt, containerPort: 15672 }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: exbanka-2
spec:
  selector:
    app: rabbitmq
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
