# Frontend container generates /config.js from ENV at start (docker-entrypoint.sh).
# API_BASE_URL can be flipped at any time by editing the ConfigMap and rolling
# the Deployment — no rebuild needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: exbanka-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/raf-si-2025/exbanka-2-frontend:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 80 }
          env:
            - { name: API_BASE_URL,        valueFrom: { configMapKeyRef: { name: exbanka-config, key: API_BASE_URL } } }
            - { name: APP_ENV,             valueFrom: { configMapKeyRef: { name: exbanka-config, key: APP_ENV } } }
            - { name: ACCESS_TOKEN_TTL_MS, valueFrom: { configMapKeyRef: { name: exbanka-config, key: ACCESS_TOKEN_TTL_MS } } }
            - { name: MOCK_MODE,           valueFrom: { configMapKeyRef: { name: exbanka-config, key: MOCK_MODE } } }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: exbanka-2
spec:
  selector:
    app: frontend
  ports:
    - { name: http, port: 80, targetPort: 80 }
