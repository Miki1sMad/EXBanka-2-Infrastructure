# Discord webhook URL mora ići u Secret (NIKAD u ConfigMap ili commit).
# Create posebno:
#   kubectl create secret generic alertmanager-discord -n exbanka-2 \
#     --from-literal=webhook_url='https://discord.com/api/webhooks/...'
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: exbanka-2
data:
  alertmanager.yml: |
    route:
      receiver: discord
      group_by: ['alertname', 'job']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h

    receivers:
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/webhook_url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.job }})'
            message: |
              {{ range .Alerts -}}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: exbanka-2
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: exbanka-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - { name: http, containerPort: 9093 }
          volumeMounts:
            - { name: config,  mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true }
            - { name: secrets, mountPath: /etc/alertmanager/secrets, readOnly: true }
            - { name: data,    mountPath: /alertmanager }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: alertmanager-discord
            items:
              - { key: webhook_url, path: webhook_url }
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: exbanka-2
spec:
  selector:
    app: alertmanager
  ports:
    - { name: http, port: 9093, targetPort: 9093 }
