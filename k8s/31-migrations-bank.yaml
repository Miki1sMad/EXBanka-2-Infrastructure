# bank-service migrations already qualify tables with `core_banking.*`,
# so search_path is not strictly required — but we keep it explicit.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-bank-service
  namespace: exbanka-2
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: ensure-schema
          image: postgres:17-alpine
          env:
            - { name: PGHOST,     valueFrom: { configMapKeyRef: { name: exbanka-config, key: DB_HOST } } }
            - { name: PGPORT,     valueFrom: { configMapKeyRef: { name: exbanka-config, key: DB_PORT } } }
            - { name: PGDATABASE, valueFrom: { configMapKeyRef: { name: exbanka-config, key: DB_NAME } } }
            - { name: PGUSER,     valueFrom: { secretKeyRef: { name: db-pguser-bankadmin, key: user } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: db-pguser-bankadmin, key: password } } }
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-c", "CREATE SCHEMA IF NOT EXISTS core_banking;"]
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args:
            - "-path=/migrations"
            - "-database=postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=require&search_path=core_banking&x-migrations-table=schema_migrations_bank"
            - "up"
          env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: exbanka-config, key: DB_HOST } } }
            - { name: DB_PORT, valueFrom: { configMapKeyRef: { name: exbanka-config, key: DB_PORT } } }
            - { name: DB_NAME, valueFrom: { configMapKeyRef: { name: exbanka-config, key: DB_NAME } } }
            - { name: DB_USER,     valueFrom: { secretKeyRef: { name: db-pguser-bankadmin, key: user } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db-pguser-bankadmin, key: password } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations, readOnly: true }
      volumes:
        # kubectl create configmap bank-migrations -n exbanka-2 \
        #   --from-file=services/bank-service/internal/database/migrations/
        - name: migrations
          configMap:
            name: bank-migrations
