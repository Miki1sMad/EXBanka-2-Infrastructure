# TEMPLATE — copy to 21-secrets.yaml, fill real values, NEVER commit.
# Apply with:  kubectl apply -f 21-secrets.yaml
#
# DB credentials are auto-generated by Crunchy operator into a separate
# secret (e.g. db-pguser-bank_admin) — Deployments source them via envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: exbanka-secrets
  namespace: exbanka-2
type: Opaque
stringData:
  # JWT
  JWT_ACCESS_SECRET: "REPLACE_ME_32_CHARS_MIN"
  JWT_REFRESH_SECRET: "REPLACE_ME_32_CHARS_MIN"
  JWT_ACTIVATION_SECRET: "REPLACE_ME_32_CHARS_MIN"

  # PCI-DSS CVV pepper (HMAC-SHA256 key). Mandatory.
  CVV_PEPPER: "REPLACE_ME_LONG_RANDOM_STRING"

  # SMTP
  SMTP_USER: "your-app-account@gmail.com"
  SMTP_PASS: "your-gmail-app-password"

  # Market-data API keys (optional — empty disables that data source).
  EODHD_API_KEY: ""
  FINNHUB_API_KEY: ""
  ALPHAVANTAGE_API_KEY: ""
  EXCHANGE_RATE_API_KEY: ""

  # Interbank
  INTERBANK_API_KEY: ""
  INTERBANK_PEER_API_KEY: ""
  INTERBANK_PEER_BASE_URL: ""
  INTERBANK_ROUTING_NUMBER: "0"
  INTERBANK_PEER_ROUTING_NUMBER: "0"

  # FCM push notifications (optional).
  FCM_SERVER_KEY: ""
