# Crunchy Postgres Operator cluster. Single DB with two schemas — user-service
# tables in `user_service`, bank-service tables in `core_banking`.
# Replication: 3 instances (HA). pgBouncer fronts connection pooling.
#
# Operator must be installed cluster-wide (or namespace-scoped) before applying.
# See: https://access.crunchydata.com/documentation/postgres-operator/
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: db
  namespace: exbanka-2
spec:
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-17.9-2610
  postgresVersion: 17
  instances:
    - name: instance1
      replicas: 3
      dataVolumeClaimSpec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: 30Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    postgres-operator.crunchydata.com/cluster: db
                    postgres-operator.crunchydata.com/instance-set: instance1
  backups:
    pgbackrest:
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbackrest:ubi9-2.58.0-2610
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 30Gi
  proxy:
    pgBouncer:
      replicas: 2
      image: registry.developers.crunchydata.com/crunchydata/crunchy-pgbouncer:ubi9-1.25-2610
  # Allow non-SSL TCP connections (services hardcode sslmode=disable). `host`
  # covers both SSL and non-SSL; scram-sha-256 never sends the password in
  # cleartext even over a plaintext socket. Traffic stays inside the cluster.
  authentication:
    rules:
      - connection: host
        method: scram-sha-256
  # Single DB, single owner. Schemas (user_service, core_banking) created by migration Jobs.
  users:
    - name: bankadmin
      password:
        type: "AlphaNumeric"
      databases:
        - bank_db
      options: "SUPERUSER"
