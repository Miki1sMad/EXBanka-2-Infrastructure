# Dashboard JSON je veliki; mountuj ga iz posebnog ConfigMap-a:
#   kubectl create configmap grafana-dashboards -n exbanka-2 \
#     --from-file=grafana/dashboards/exbanka-red.json
#
# Admin password iz Secret-a:
#   kubectl create secret generic grafana-admin -n exbanka-2 \
#     --from-literal=user=admin --from-literal=password=<strong>
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: exbanka-2
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'exbanka'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: exbanka-2
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: exbanka-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: GF_SECURITY_ADMIN_USER,     valueFrom: { secretKeyRef: { name: grafana-admin, key: user } } }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: grafana-admin, key: password } } }
            - { name: GF_USERS_ALLOW_SIGN_UP,     value: "false" }
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards,  readOnly: true }
            - { name: dashboards,      mountPath: /var/lib/grafana/dashboards,           readOnly: true }
            - { name: data,            mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items:
              - { key: datasources.yml, path: datasources.yml }
        - name: provisioning-db
          configMap:
            name: grafana-provisioning
            items:
              - { key: dashboards.yml, path: exbanka.yml }
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: exbanka-2
spec:
  selector:
    app: grafana
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
